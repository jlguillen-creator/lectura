lectura:[
{t:"La Laia és una nena que viu en un poble petit al costat del mar. Cada matí, camina fins a la platja amb el seu gos, que es diu Coco. A la platja, troben petxines de molts colors i juguen amb les ones.",qs:[{q:"On viu la Laia?",o:["A la muntanya","Al costat del mar","A la ciutat"],c:1},{q:"Com es diu el seu gos?",o:["Lluna","Coco","Max"],c:1}],wc:46},
{t:"En Marc vol ser astronauta quan sigui gran. Cada nit, mira les estrelles des de la finestra. El seu avi li va regalar un telescopi per al seu aniversari i ara pot veure la lluna molt a prop.",qs:[{q:"Què vol ser en Marc?",o:["Bomber","Astronauta","Mestre"],c:1},{q:"Qui li va regalar el telescopi?",o:["La mare","El pare","L'avi"],c:2}],wc:40},
{t:"La Clara i el seu germà Pau van anar al zoo. Van veure lleons, girafes i elefants. El que més els va agradar va ser el dofí, que saltava molt alt fora de l'aigua. Després van menjar un gelat de maduixa.",qs:[{q:"Quin animal els va agradar més?",o:["El lleó","La girafa","El dofí"],c:2},{q:"De quin sabor era el gelat?",o:["Xocolata","Maduixa","Vainilla"],c:1}],wc:43},
{t:"En Biel viu en una granja amb molts animals. Cada matí dona menjar a les gallines i recull els ous. El seu animal preferit és un gat taronja que es diu Sol.",qs:[{q:"On viu en Biel?",o:["En un pis","En una granja","En un castell"],c:1},{q:"Com es diu el seu gat?",o:["Lluna","Sol","Estrella"],c:1}],wc:35},
{t:"La Gemma va anar amb la seva classe a visitar un museu. Van veure quadres molt grans i escultures antigues. A la Gemma li va encantar un quadre d'un vaixell al mar.",qs:[{q:"On va anar la Gemma?",o:["Al zoo","Al museu","Al parc"],c:1},{q:"Què hi havia al quadre?",o:["Un cavall","Unes flors","Un vaixell"],c:2}],wc:35},
{t:"La Noa té una bicicleta nova de color vermell. Cada tarda, surt a passejar pel parc amb les seves amigues. Li agrada molt anar ràpid perquè sent el vent a la cara. Un dia va veure un esquirol pujant a un arbre.",qs:[{q:"De quin color és la bicicleta?",o:["Blau","Vermell","Verd"],c:1},{q:"Quin animal va veure?",o:["Un gat","Un esquirol","Un ocell"],c:1}],wc:43},
{t:"En Jan va aprendre a cuinar amb la seva àvia. Primer van fer una amanida amb tomàquets i enciam. Després van preparar una sopa de verdures. La part preferida d'en Jan va ser remenar la sopa amb la cullera gran.",qs:[{q:"Amb qui va cuinar en Jan?",o:["El pare","La mare","L'àvia"],c:2},{q:"Què van fer primer?",o:["Una sopa","Una amanida","Un pastís"],c:1}],wc:42},
{t:"La Lola té una caixa plena de colors. Li agrada dibuixar animals fantàstics: dracs amb ales de papallona, peixos que volen pel cel i gats amb barrets de mag. La seva mestra diu que té molta imaginació.",qs:[{q:"Què li agrada dibuixar?",o:["Cotxes","Animals fantàstics","Cases"],c:1},{q:"Què diu la mestra?",o:["Que és ràpida","Que té imaginació","Que és ordenada"],c:1}],wc:40},
{t:"La família d'en Pol va anar de càmping a la muntanya. Van muntar la tenda al costat d'un riu. A la nit van encendre un foc i van explicar contes de por. En Pol va dormir dins el sac molt calentó.",qs:[{q:"On van anar de càmping?",o:["A la platja","A la muntanya","Al bosc"],c:1},{q:"Què van fer a la nit?",o:["Van nedar","Van explicar contes","Van cuinar"],c:1}],wc:42},
{t:"La Rita va rebre una carta del seu cosí que viu a França. La carta deia que havia vist la Torre Eiffel i que era altíssima. La Rita vol anar-hi algun dia per veure-la ella mateixa.",qs:[{q:"D'on era la carta?",o:["D'Itàlia","De França","D'Anglaterra"],c:1},{q:"Què va veure el cosí?",o:["Un castell","La Torre Eiffel","Un museu"],c:1}],wc:38},
,{t:"L'Anna i en Tomàs van trobar una capsa misteriosa al jardí. Dins hi havia un mapa antic amb un camí en vermell. Van seguir el camí fins a un arbre gran on hi havia una motxilla plena de llibres.",qs:[{q:"Què hi havia a la capsa?",o:["Joguines","Un mapa","Llaminadures"],c:1},{q:"Què hi havia a l'arbre?",o:["Un ocell","Una motxilla","Un gat"],c:1}],wc:40},
{t:"En Sergi va anar a una granja ecològica. Van veure vaques, ovelles i gallines. Van aprendre que les vaques donen llet i les gallines ponen ous. El que més li va agradar va ser donar menjar als conills.",qs:[{q:"On van anar?",o:["Al zoo","A una granja","Al parc"],c:1},{q:"Què li va agradar més?",o:["Les vaques","Els conills","Les gallines"],c:1}],wc:40},
{t:"La Júlia somiava que tenia ales i podia volar. Va sobrevolar la seva ciutat i va veure les cases petites. Va aterrar al cim d'una muntanya i va trobar un gat que parlava. El gat li va dir que era màgic.",qs:[{q:"Què somiava?",o:["Que nedava","Que volava","Que corria"],c:1},{q:"Què va trobar?",o:["Un drac","Un gat parlant","Un tresor"],c:1}],wc:42},
{t:"En David col·lecciona pedres de colors. La seva pedra preferida és una de color blau que va trobar al riu. Té més de cinquanta pedres a la seva habitació ordenades per colors.",qs:[{q:"Què col·lecciona?",o:["Segells","Pedres","Cromos"],c:1},{q:"On va trobar la blava?",o:["A la platja","Al riu","A la muntanya"],c:1}],wc:35},
{t:"La Marina i la seva germana van preparar un espectacle de titelles. Van fer les titelles amb mitjons i botons. La història tractava d'una princesa i un drac amic. Als pares els va encantar.",qs:[{q:"Amb què van fer les titelles?",o:["Paper","Mitjons","Fusta"],c:1},{q:"De què era la història?",o:["Animals","Princesa i drac","Pirates"],c:1}],wc:38},
{t:"En Roger va participar en un concurs de dibuix. Va dibuixar muntanyes, un riu i un pont antic. Li van donar el segon premi i va rebre colors nous. Era la primera vegada que guanyava.",qs:[{q:"En què va participar?",o:["Cursa","Concurs de dibuix","Examen"],c:1},{q:"Quin premi?",o:["Primer","Segon","Tercer"],c:1}],wc:36},
{t:"L'Èlia va fer una acampada al bosc. Van muntar la tenda entre dos pins. Al matí van veure un cervatol que bevia aigua. L'Èlia va fer fotos amb la càmera de la mare.",qs:[{q:"On van muntar la tenda?",o:["Platja","Entre pins","Llac"],c:1},{q:"Quin animal van veure?",o:["Un ós","Un esquirol","Un cervatol"],c:2}],wc:35},
{t:"En Nil tenia por de la foscor. El pare li va regalar una llanterna que projectava estrelles al sostre. Des d'aquella nit ja no tenia por perquè se sentia com si dormís entre estrelles.",qs:[{q:"De què tenia por?",o:["Aigua","Foscor","Gossos"],c:1},{q:"Què projectava?",o:["Lluna","Estrelles","Animals"],c:1}],wc:34},
{t:"La família d'en Pau va adoptar un gos del refugi. Es diu Roc i és blanc amb taques marrons. Al principi era tímid però ara juga amb tothom i li encanta passejar pel parc.",qs:[{q:"D'on van adoptar el gos?",o:["Botiga","Refugi","Amic"],c:1},{q:"Com és?",o:["Negre","Blanc amb taques","Gris"],c:1}],wc:36},
{t:"La Bet fa ballet des que tenia quatre anys. El seu somni és ballar a un teatre gran. Cada tarda practica al menjador. La professora diu que té molt talent.",qs:[{q:"Què fa?",o:["Gimnàstica","Ballet","Natació"],c:1},{q:"On practica?",o:["Habitació","Jardí","Menjador"],c:2}],wc:32},
{t:"En Joan i la seva cosina van construir una cabana al jardí amb branques i mantes. Van posar-hi coixins i una llanterna. Era el seu refugi secret. L'avi els va portar xocolata calenta.",qs:[{q:"Què van construir?",o:["Castell de sorra","Cabana","Robot"],c:1},{q:"Què va portar l'avi?",o:["Galetes","Suc","Xocolata calenta"],c:2}],wc:36},
{t:"La Núria va trobar una papallona amb una ala trencada. La va posar dins una capsa amb flors. Cada dia li portava aigua amb mel. Al cap d'una setmana va poder volar de nou.",qs:[{q:"Què li passava?",o:["Perduda","Ala trencada","Gana"],c:1},{q:"Què va passar?",o:["Va morir","Va volar","Es va quedar"],c:1}],wc:38},
{t:"En Quim i la germana van fer galetes d'estrella per al dia de la mare. Hi van posar xocolata i sucre de colors. La mare se li van omplir els ulls de llàgrimes d'alegria.",qs:[{q:"Per qui les galetes?",o:["L'avi","La mare","La mestra"],c:1},{q:"Quina forma?",o:["Cor","Estrella","Lluna"],c:1}],wc:38},
{t:"L'Aina va veure un arc de Sant Martí des de la finestra. La mestra va explicar que apareix quan plou i fa sol. Té set colors. L'Aina el va dibuixar al seu quadern.",qs:[{q:"D'on el va veure?",o:["Jardí","Finestra","Cotxe"],c:1},{q:"Quants colors?",o:["Cinc","Sis","Set"],c:2}],wc:35},
{t:"En Max és un gos policia que ajuda a trobar persones perdudes a la muntanya. Té un nas molt fi. Un dia va trobar un excursionista perdut al bosc. Tothom va aplaudir en Max.",qs:[{q:"Què és en Max?",o:["Un gat","Un gos policia","Un cavall"],c:1},{q:"A qui va trobar?",o:["Un nen","Un excursionista","Un gat"],c:1}],wc:35}],

{t:"Laia es una niña que vive en un pueblo pequeño al lado del mar. Cada mañana, camina hasta la playa con su perro, que se llama Coco. En la playa, encuentran conchas de muchos colores y juegan con las olas.",qs:[{q:"¿Dónde vive Laia?",o:["En la montaña","Al lado del mar","En la ciudad"],c:1},{q:"¿Cómo se llama su perro?",o:["Luna","Coco","Max"],c:1}],wc:44},
{t:"Marc quiere ser astronauta cuando sea mayor. Cada noche, mira las estrellas desde la ventana. Su abuelo le regaló un telescopio para su cumpleaños y ahora puede ver la luna muy de cerca.",qs:[{q:"¿Qué quiere ser Marc?",o:["Bombero","Astronauta","Maestro"],c:1},{q:"¿Quién le regaló el telescopio?",o:["La madre","El padre","El abuelo"],c:2}],wc:35},
{t:"Clara y su hermano Pau fueron al zoo. Vieron leones, jirafas y elefantes. Lo que más les gustó fue el delfín, que saltaba muy alto fuera del agua. Después comieron un helado de fresa.",qs:[{q:"¿Qué animal les gustó más?",o:["El león","La jirafa","El delfín"],c:2},{q:"¿De qué sabor era el helado?",o:["Chocolate","Fresa","Vainilla"],c:1}],wc:38},
{t:"Biel vive en una granja con muchos animales. Cada mañana da de comer a las gallinas y recoge los huevos. Su animal favorito es un gato naranja que se llama Sol.",qs:[{q:"¿Dónde vive Biel?",o:["En un piso","En una granja","En un castillo"],c:1},{q:"¿Cómo se llama su gato?",o:["Luna","Sol","Estrella"],c:1}],wc:33},
{t:"Gemma fue con su clase a visitar un museo. Vieron cuadros muy grandes y esculturas antiguas. A Gemma le encantó un cuadro de un barco en el mar.",qs:[{q:"¿Dónde fue Gemma?",o:["Al zoo","Al museo","Al parque"],c:1},{q:"¿Qué había en el cuadro?",o:["Un caballo","Unas flores","Un barco"],c:2}],wc:30},
{t:"Noa tiene una bicicleta nueva de color rojo. Cada tarde, sale a pasear por el parque con sus amigas. Le gusta mucho ir rápido porque siente el viento en la cara. Un día vio una ardilla subiendo a un árbol.",qs:[{q:"¿De qué color es la bicicleta?",o:["Azul","Rojo","Verde"],c:1},{q:"¿Qué animal vio?",o:["Un gato","Una ardilla","Un pájaro"],c:1}],wc:42},
{t:"Jan aprendió a cocinar con su abuela. Primero hicieron una ensalada con tomates y lechuga. Después prepararon una sopa de verduras. Lo que más le gustó a Jan fue remover la sopa con el cucharón grande.",qs:[{q:"¿Con quién cocinó Jan?",o:["El padre","La madre","La abuela"],c:2},{q:"¿Qué hicieron primero?",o:["Una sopa","Una ensalada","Un pastel"],c:1}],wc:40},
{t:"Lola tiene una caja llena de colores. Le gusta dibujar animales fantásticos: dragones con alas de mariposa, peces que vuelan por el cielo y gatos con sombreros de mago. Su profesora dice que tiene mucha imaginación.",qs:[{q:"¿Qué le gusta dibujar?",o:["Coches","Animales fantásticos","Casas"],c:1},{q:"¿Qué dice la profesora?",o:["Que es rápida","Que tiene imaginación","Que es ordenada"],c:1}],wc:42},
{t:"La familia de Pol fue de camping a la montaña. Montaron la tienda al lado de un río. Por la noche encendieron un fuego y contaron cuentos de miedo. Pol durmió dentro del saco muy calentito.",qs:[{q:"¿Dónde fueron de camping?",o:["A la playa","A la montaña","Al bosque"],c:1},{q:"¿Qué hicieron por la noche?",o:["Nadaron","Contaron cuentos","Cocinaron"],c:1}],wc:40},
{t:"Rita recibió una carta de su primo que vive en Francia. La carta decía que había visto la Torre Eiffel y que era altísima. Rita quiere ir algún día para verla ella misma.",qs:[{q:"¿De dónde era la carta?",o:["De Italia","De Francia","De Inglaterra"],c:1},{q:"¿Qué vio el primo?",o:["Un castillo","La Torre Eiffel","Un museo"],c:1}],wc:35},
,{t:"Anna y Tomás encontraron una caja misteriosa en el jardín. Dentro había un mapa antiguo con un camino en rojo. Siguieron el camino hasta un árbol grande donde había una mochila llena de libros de cuentos.",qs:[{q:"¿Qué había en la caja?",o:["Juguetes","Un mapa","Golosinas"],c:1},{q:"¿Qué había en el árbol?",o:["Un pájaro","Una mochila","Un gato"],c:1}],wc:40},
{t:"Sergi fue con su clase a una granja ecológica. Vieron vacas, ovejas y gallinas. Aprendieron que las vacas dan leche y las gallinas ponen huevos. Lo que más le gustó fue dar de comer a los conejos.",qs:[{q:"¿Dónde fueron?",o:["Al zoo","A una granja","Al parque"],c:1},{q:"¿Qué le gustó más?",o:["Las vacas","Los conejos","Las gallinas"],c:1}],wc:40},
{t:"Julia soñaba que tenía alas y podía volar. Sobrevoló su ciudad y vio las casas pequeñas. Aterrizó en una montaña y encontró un gato que hablaba. El gato le dijo que era mágico.",qs:[{q:"¿Qué soñaba?",o:["Que nadaba","Que volaba","Que corría"],c:1},{q:"¿Qué encontró?",o:["Un dragón","Un gato parlante","Un tesoro"],c:1}],wc:38},

{t:"Marina y su hermana prepararon un espectáculo de títeres. Hicieron los títeres con calcetines y botones. La historia trataba de una princesa y un dragón amigo. Los padres aplaudieron mucho.",qs:[{q:"¿Con qué hicieron los títeres?",o:["Papel","Calcetines","Madera"],c:1},{q:"¿De qué era la historia?",o:["Animales","Princesa y dragón","Piratas"],c:1}],wc:35},
{t:"Roger participó en un concurso de dibujo. Dibujó montañas, un río y un puente antiguo. Le dieron el segundo premio y recibió colores nuevos. Era la primera vez que ganaba.",qs:[{q:"¿En qué participó?",o:["Carrera","Concurso de dibujo","Examen"],c:1},{q:"¿Qué premio?",o:["Primero","Segundo","Tercero"],c:1}],wc:33},
{t:"Elia fue de acampada al bosque. Montaron la tienda entre dos pinos. Por la mañana vieron un cervatillo bebiendo agua. Elia hizo fotos con la cámara de su madre.",qs:[{q:"¿Dónde montaron la tienda?",o:["Playa","Entre pinos","Lago"],c:1},{q:"¿Qué animal vieron?",o:["Un oso","Una ardilla","Un cervatillo"],c:2}],wc:33},
{t:"Nil tenía miedo de la oscuridad. Su padre le regaló una linterna que proyectaba estrellas en el techo. Desde esa noche ya no tenía miedo porque se sentía entre estrellas.",qs:[{q:"¿De qué tenía miedo?",o:["Del agua","De la oscuridad","De los perros"],c:1},{q:"¿Qué proyectaba?",o:["Luna","Estrellas","Animales"],c:1}],wc:33},
{t:"La familia de Pau adoptó un perro del refugio. Se llama Roc y es blanco con manchas. Al principio era tímido pero ahora juega con todos y le encanta pasear por el parque.",qs:[{q:"¿De dónde lo adoptaron?",o:["Tienda","Refugio","Amigo"],c:1},{q:"¿Cómo es?",o:["Negro","Blanco con manchas","Gris"],c:1}],wc:35},
{t:"Bet hace ballet desde los cuatro años. Su sueño es bailar en un teatro grande. Cada tarde practica en el comedor. Su profesora dice que tiene mucho talento.",qs:[{q:"¿Qué hace?",o:["Gimnasia","Ballet","Natación"],c:1},{q:"¿Dónde practica?",o:["Habitación","Jardín","Comedor"],c:2}],wc:30},
{t:"Joan y su prima construyeron una cabaña en el jardín con ramas y mantas. Pusieron cojines y una linterna. Era su refugio secreto. El abuelo les trajo chocolate caliente.",qs:[{q:"¿Qué construyeron?",o:["Castillo de arena","Cabaña","Robot"],c:1},{q:"¿Qué trajo el abuelo?",o:["Galletas","Zumo","Chocolate caliente"],c:2}],wc:33},
{t:"Nuria encontró una mariposa con un ala rota. La puso en una caja con flores. Cada día le llevaba agua con miel. Al cabo de una semana pudo volar de nuevo.",qs:[{q:"¿Qué le pasaba?",o:["Perdida","Ala rota","Hambre"],c:1},{q:"¿Qué pasó al final?",o:["Murió","Pudo volar","Se quedó"],c:1}],wc:35},
{t:"Quim y su hermana hicieron galletas de estrella para el día de la madre. Les pusieron chocolate y azúcar de colores. Mamá se emocionó mucho y les dio un beso enorme.",qs:[{q:"¿Para quién las galletas?",o:["Abuelo","Madre","Profesora"],c:1},{q:"¿Qué forma tenían?",o:["Corazón","Estrella","Luna"],c:1}],wc:34},
{t:"Aina vio un arcoíris desde la ventana de clase. La profesora explicó que aparece cuando llueve y hace sol a la vez. Tiene siete colores. Aina lo dibujó en su cuaderno.",qs:[{q:"¿Desde dónde lo vio?",o:["Jardín","Ventana","Coche"],c:1},{q:"¿Cuántos colores?",o:["Cinco","Seis","Siete"],c:2}],wc:33},
{t:"Max es un perro policía que ayuda a encontrar personas perdidas. Tiene un olfato muy fino. Un día encontró a un excursionista perdido en el bosque. Todos aplaudieron a Max.",qs:[{q:"¿Qué es Max?",o:["Un gato","Un perro policía","Un caballo"],c:1},{q:"¿A quién encontró?",o:["Un niño","Un excursionista","Un gato"],c:1}],wc:33}],

let spW=[],spFd=[],spG=[],spSz=8,spSel=[],spDrg=false;
// Track found cell keys permanently
let spFdCells=new Set();

function sSopa(){showS('s-sopa');const data=D[lang].sopa;const pz=data[Math.floor(Math.random()*data.length)];spW=pz.w;spSz=Math.max(8,Math.max(...spW.map(w=>w.length))+2);spFd=[];spSel=[];spDrg=false;spFdCells=new Set();spG=mkGrid(spW,spSz);rSp()}

function mkGrid(words,sz){
  const g=Array.from({length:sz},()=>Array(sz).fill(''));
  const dirs=[[0,1],[1,0],[1,1],[0,-1],[-1,0],[1,-1]];
  // Store placement info for lookup
  mkGrid.placements=[];
  words.forEach(w=>{let ok=false,att=0;
    while(!ok&&att<500){att++;const d=dirs[Math.floor(Math.random()*dirs.length)];const r=Math.floor(Math.random()*sz);const c=Math.floor(Math.random()*sz);
      const er=r+d[0]*(w.length-1);const ec=c+d[1]*(w.length-1);if(er<0||er>=sz||ec<0||ec>=sz)continue;
      let fit=true;for(let i=0;i<w.length;i++){const cr2=r+d[0]*i;const cc2=c+d[1]*i;if(g[cr2][cc2]!==''&&g[cr2][cc2]!==w[i]){fit=false;break}}
      if(fit){const cells=[];for(let i=0;i<w.length;i++){const cr2=r+d[0]*i;const cc2=c+d[1]*i;g[cr2][cc2]=w[i];cells.push(cr2+','+cc2)}mkGrid.placements.push({word:w,cells});ok=true}}});
  const lt=lang==='ca'?'ABCDEFGHIJLMNOPQRSTUVXZ':'ABCDEFGHIJKLMNOPQRSTUVWXYZ';
  for(let r=0;r<sz;r++)for(let c=0;c<sz;c++)if(g[r][c]==='')g[r][c]=lt[Math.floor(Math.random()*lt.length)];
  return g;
}

function getCellsForWord(w){
  const pl=mkGrid.placements||[];
  const found=pl.find(p=>p.word===w);
  return found?found.cells:[];
}

function rSp(){
  // Targets
  const tg=document.getElementById('sp-t');tg.innerHTML='';
  spW.forEach(w=>{const s=document.createElement('span');s.className='spw'+(spFd.includes(w)?' fd':'');s.textContent=w;tg.appendChild(s)});

  // Grid
  const g=document.getElementById('sp-g');g.innerHTML='';g.style.gridTemplateColumns=`repeat(${spSz},1fr)`;g.style.maxWidth=(spSz*38)+'px';

  const selSet=new Set(spSel.map(s=>s.r+','+s.c));

  for(let r=0;r<spSz;r++)for(let c=0;c<spSz;c++){
    const cell=document.createElement('div');cell.className='spc';cell.textContent=spG[r][c];
    cell.dataset.r=r;cell.dataset.c=c;
    if(spFdCells.has(r+','+c))cell.classList.add('fd');
    if(selSet.has(r+','+c))cell.classList.add('sel');
    g.appendChild(cell);
  }

  // Touch/pointer handling on the grid container
  g.onpointerdown=e=>{e.preventDefault();spDrg=true;const rc=cellAt(e);if(rc)spSel=[rc];rSp()};
  g.onpointermove=e=>{if(!spDrg)return;e.preventDefault();const rc=cellAt(e);if(rc&&!spSel.find(s=>s.r===rc.r&&s.c===rc.c)){
    // Only allow straight-line selection
    if(spSel.length>=2){const dr=spSel[1].r-spSel[0].r;const dc=spSel[1].c-spSel[0].c;const nr=rc.r-spSel[spSel.length-1].r;const nc=rc.c-spSel[spSel.length-1].c;if(nr!==dr||nc!==dc)return}
    else if(spSel.length===1){const dr=rc.r-spSel[0].r;const dc=rc.c-spSel[0].c;if(Math.abs(dr)>1||Math.abs(dc)>1)return}
    spSel.push(rc);rSp()}};
  g.onpointerup=()=>{spDrg=false;chkSp()};
  g.onpointerleave=()=>{if(spDrg){spDrg=false;chkSp()}};
  g.onpointercancel=()=>{spDrg=false;spSel=[];rSp()};
}

function cellAt(e){
  const el=document.elementFromPoint(e.clientX,e.clientY);
  if(el&&el.classList.contains('spc'))return{r:+el.dataset.r,c:+el.dataset.c};
  return null;
}

function chkSp(){
  const str=spSel.map(s=>spG[s.r][s.c]).join('');
  const rev=[...str].reverse().join('');
  const found=spW.find(w=>!spFd.includes(w)&&(w===str||w===rev));
  if(found){
    spFd.push(found);
    // Mark found cells permanently
    getCellsForWord(found).forEach(c=>spFdCells.add(c));
  }
  spSel=[];rSp();
  if(spFd.length===spW.length){
    const p=spW.length*8;addP(p);streak++;updUI();addH('sopa',spW.length+'/'+spW.length);markD('sopa');
    setTimeout(()=>showM('🔍',t('amz'),p,`${spW.length} ${t('corr')}!`),400);
  }
}

function today(){return new Date().toISOString().slice(0,10)}
function updD(){if(dDate!==today()){dDate=today();dGames=[];dBon=false;save()}const b=document.getElementById('db');if(dBon){b.classList.add('dd');document.getElementById('el-dd').textContent=t('daily-ok')}else{b.classList.remove('dd');document.getElementById('el-dd').textContent=t('daily-d')}}
const DG=['flash','crono','comp'];
function startDaily(){if(dBon)return;showS('s-daily');rDC()}
function rDC(){const div=document.getElementById('dc');div.innerHTML='';DG.forEach((g,i)=>{const done=dGames.includes(g);const c=document.createElement('div');c.className='gc';c.style.opacity=done?'.5':'1';const em={flash:'⚡',crono:'📖',comp:'✏️'}[g];c.innerHTML=`<div class="gct"><div class="gce">${done?'✅':em}</div><div class="gcn">${t('daily-st')} ${i+1}: ${t('gt'+(g==='flash'?1:g==='crono'?2:6))}</div></div>`;if(!done)c.onclick=()=>startG(g);div.appendChild(c)})}
function markD(g){if(dDate===today()&&DG.includes(g)&&!dGames.includes(g)){dGames.push(g);save();if(dGames.length>=DG.length&&!dBon){dBon=true;addP(50);updUI();save();updD();setTimeout(()=>showM('🎯',t('daily-t'),50,t('daily-b')),1400)}}}

function rHist(){
  const wE=hist.filter(h=>h.w);const avg=wE.length?Math.round(wE.reduce((a,b)=>a+b.w,0)/wE.length):0;const bw=wE.length?Math.max(...wE.map(h=>h.w)):0;
  document.getElementById('stg').innerHTML=`<div class="stc"><div class="stv">${hist.length}</div><div class="stl">${t('tg')}</div></div><div class="stc"><div class="stv">${pts}</div><div class="stl">${t('tpt')}</div></div><div class="stc"><div class="stv">${avg}</div><div class="stl">${t('twp')}</div></div><div class="stc"><div class="stv">${bw}</div><div class="stl">${t('bwp')}</div></div>`;
  dChart(wE.slice(0,20).reverse());
  const hl=document.getElementById('hl');if(!hist.length){hl.innerHTML=`<div class="emp">${t('emp')}</div>`;return}hl.innerHTML='';
  const gn={flash:t('gt1'),crono:t('gt2'),ordre:t('gt3'),lectura:t('gt4'),sopa:t('gt5'),comp:t('gt6')};
  hist.slice(0,30).forEach(h=>{const d=document.createElement('div');d.className='hi';const dt=new Date(h.d);d.innerHTML=`<div><div class="hig">${gn[h.g]||h.g}</div><div class="hid">${dt.getDate()}/${dt.getMonth()+1} ${dt.getHours()}:${String(dt.getMinutes()).padStart(2,'0')}</div></div><div style="text-align:right"><div class="his">${h.sc}</div>${h.w?`<div class="hiw">${h.w} ppm</div>`:''}</div>`;hl.appendChild(d)})}

function dChart(entries){
  const cv=document.getElementById('cv');const ctx=cv.getContext('2d');const dpr=window.devicePixelRatio||1;const rect=cv.parentElement.getBoundingClientRect();cv.width=rect.width*dpr;cv.height=rect.height*dpr;cv.style.width=rect.width+'px';cv.style.height=rect.height+'px';ctx.scale(dpr,dpr);const W=rect.width,H=rect.height;ctx.clearRect(0,0,W,H);
  if(entries.length<2){ctx.fillStyle='#6B3A6B';ctx.font='600 13px Quicksand';ctx.textAlign='center';ctx.fillText(t('emp'),W/2,H/2);return}
  const p={t:14,r:10,b:20,l:30};const cw=W-p.l-p.r;const ch=H-p.t-p.b;const vals=entries.map(e=>e.w);const mn=Math.max(0,Math.min(...vals)-10);const mx=Math.max(...vals)+10;const rng=mx-mn||1;
  ctx.strokeStyle='#F3E8FF';ctx.lineWidth=1;for(let i=0;i<=4;i++){const y=p.t+ch*(1-i/4);ctx.beginPath();ctx.moveTo(p.l,y);ctx.lineTo(W-p.r,y);ctx.stroke();ctx.fillStyle='#6B3A6B';ctx.font='600 8px Quicksand';ctx.textAlign='right';ctx.fillText(Math.round(mn+rng*(i/4)),p.l-3,y+3)}
  const ps=entries.map((e,i)=>({x:p.l+cw*(i/(entries.length-1)),y:p.t+ch*(1-(e.w-mn)/rng)}));
  const grad=ctx.createLinearGradient(0,p.t,0,H-p.b);grad.addColorStop(0,'rgba(192,132,252,.3)');grad.addColorStop(1,'rgba(192,132,252,.02)');ctx.beginPath();ctx.moveTo(ps[0].x,H-p.b);ps.forEach(pt=>ctx.lineTo(pt.x,pt.y));ctx.lineTo(ps[ps.length-1].x,H-p.b);ctx.closePath();ctx.fillStyle=grad;ctx.fill();
  ctx.beginPath();ps.forEach((pt,i)=>{i===0?ctx.moveTo(pt.x,pt.y):ctx.lineTo(pt.x,pt.y)});ctx.strokeStyle='#9333EA';ctx.lineWidth=2.5;ctx.lineJoin='round';ctx.stroke();
  ps.forEach(pt=>{ctx.beginPath();ctx.arc(pt.x,pt.y,3.5,0,Math.PI*2);ctx.fillStyle='#9333EA';ctx.fill();ctx.strokeStyle='white';ctx.lineWidth=1.5;ctx.stroke()})}

function gamesPlayed(){return hist.length}

function checkCatUnlock(){
  const gp=gamesPlayed();
  let newCat=null;
  CATS.forEach(c=>{
    if(gp>=c.req&&!catsUnlocked.includes(c.id)){
      catsUnlocked.push(c.id);
      newCat=c;
    }
  });
  if(newCat){
    save();
    // Show unlock modal after a short delay (after game modal)
    setTimeout(()=>{
      const svgHtml=`<div class="cat-unlock-svg">${newCat.svg}</div>`;
      document.getElementById('m-e').innerHTML=svgHtml;
      document.getElementById('m-t').textContent=(lang==='ca'?'Nou gatet!':'¡Nuevo gatito!');
      document.getElementById('m-p').textContent=newCat.name[lang];
      document.getElementById('m-m').textContent=newCat.desc[lang];
      document.getElementById('modal').classList.add('show');
      cft();
    },1800);
  }
}

function rCats(){
  const gp=gamesPlayed();
  const unlocked=CATS.filter(c=>catsUnlocked.includes(c.id)).length;
  document.getElementById('cat-counter').textContent=`${unlocked} ${t('cats-of')} ${CATS.length} 🐱`;
  const grid=document.getElementById('cats-grid');grid.innerHTML='';
  CATS.forEach(c=>{
    const isUnlocked=catsUnlocked.includes(c.id);
    const isNew=isUnlocked&&!catsNewSeen.includes(c.id);
    const card=document.createElement('div');
    card.className='cat-card'+(isUnlocked?'':' locked');
    card.innerHTML=`${isNew?'<div class="cat-new">'+t('cats-new')+'</div>':''}
      <div class="cat-svg">${c.svg}</div>
      <div class="cat-name">${c.name[lang]}</div>
      ${isUnlocked?'<div class="cat-badge">✅</div>':`<div class="cat-req">${c.req} ${t('tg')}</div>`}`;
    if(isNew){card.onclick=()=>{
      if(!catsNewSeen.includes(c.id)){catsNewSeen.push(c.id);save()}
      card.querySelector('.cat-new')?.remove();
    }}
    grid.appendChild(card);
  });
}

// Hook into addH to check for cat unlocks
const _origAddH=addH;
addH=function(g,sc,w){_origAddH(g,sc,w);checkCatUnlock()};

load();setLang(lang);buildGC();updUI();updD();
